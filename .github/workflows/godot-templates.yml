name: Build encrypted Godot export templates

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      godot_tag:
        description: "Godot 4 tag，例如 4.7-stable；留空则自动检测最新正式稳定版"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: godot-encrypted-export-templates
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version_id: ${{ steps.release.outputs.version_id }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      should_build: ${{ steps.release.outputs.should_build }}

    steps:
      - name: 查找最新 Godot 4 正式稳定版
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.godot_tag || '' }}
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_TAG:-}" ]]; then
            tag="$REQUESTED_TAG"
          else
            tag="$(
              gh api 'repos/godotengine/godot/releases?per_page=100' \
                --jq '([.[]
                  | select(
                      .draft == false
                      and .prerelease == false
                      and (.tag_name | test("^4[.][0-9]+([.][0-9]+)?-stable$"))
                    )
                ] | max_by(.published_at) | .tag_name) // empty'
            )"
          fi

          if [[ ! "$tag" =~ ^4\.[0-9]+(\.[0-9]+)?-stable$ ]]; then
            echo "期望 Godot 4.x 正式稳定标签，实际得到：$tag" >&2
            exit 1
          fi

          upstream_tag="$(
            gh api "repos/godotengine/godot/releases/tags/$tag" \
              --jq 'select(.draft == false and .prerelease == false) | .tag_name'
          )"
          [[ "$upstream_tag" == "$tag" ]]

          version_id="${tag%-stable}.stable"
          release_tag="templates-$tag"
          should_build=true

          if is_draft="$(
            gh release view "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft' 2>/dev/null
          )"; then
            if [[ "$is_draft" == "false" ]]; then
              should_build=false
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

  prepare:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GODOT_TAG: ${{ needs.detect.outputs.tag }}
      RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}

    steps:
      - name: 创建干净的草稿 Release
        shell: bash
        run: |
          set -euo pipefail

          if is_draft="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft \
              --jq '.isDraft' 2>/dev/null
          )"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG 已正式发布，拒绝覆盖。" >&2
              exit 1
            fi

            gh release delete "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --yes \
              --cleanup-tag
          fi

          cat > release-notes.md <<EOF
          基于 Godot 官方标签 [$GODOT_TAG](https://github.com/godotengine/godot/releases/tag/$GODOT_TAG) 编译。

          - Linux：x86_64 debug + release
          - Windows：x86_64 debug + release，包含 console wrapper
          - macOS：Universal 2，包含 x86_64 + arm64、debug + release
          - 构建时保留 3D 支持，禁用摄像头模块
          - PCK 密钥通过仓库 Secret 在编译时注入，不会打印或作为文件上传

          这些是支持 2D HDR 后处理的非 .NET/Mono 模板。
          EOF

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Encrypted Godot export templates $GODOT_TAG" \
            --notes-file release-notes.md \
            --draft

  linux:
    needs:
      - detect
      - prepare
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-24.04

    timeout-minutes: 240

    permissions:
      contents: write

    env:
      GODOT_TAG: ${{ needs.detect.outputs.tag }}
      VERSION_ID: ${{ needs.detect.outputs.version_id }}
      RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}

    steps:
      - name: 安装 Linux 编译依赖
        shell: bash
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git ca-certificates zip pkg-config \
            libx11-dev libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev \
            libxi-dev libxrandr-dev libwayland-dev

      - name: 获取 Godot 源码
        uses: actions/checkout@v7
        with:
          repository: godotengine/godot
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 SCons 并显示构建环境
        shell: bash
        run: |
          python -m pip install 'scons>=4.4,<5'

          python --version
          getconf GNU_LIBC_VERSION
          gcc --version | sed -n '1p'
          scons --version

      - name: 编译 Linux x86_64 模板
        shell: bash
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_PCK_KEY }}
        run: |
          if [[ ! "${SCRIPT_AES256_ENCRYPTION_KEY:-}" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo "GODOT_PCK_KEY 必须是64个十六进制字符。" >&2
            exit 1
          fi

          scons --jobs=4 \
            platform=linuxbsd \
            target=template_debug \
            arch=x86_64 \
            module_camera_enabled=no \
            debug_symbols=no

          scons --jobs=4 \
            platform=linuxbsd \
            target=template_release \
            arch=x86_64 \
            module_camera_enabled=no \
            debug_symbols=no

          ./bin/godot.linuxbsd.template_release.x86_64 --version

      - name: 打包 Linux 模板
        shell: bash
        run: |
          mkdir -p stage dist

          cp bin/godot.linuxbsd.template_debug.x86_64 \
            stage/linux_debug.x86_64

          cp bin/godot.linuxbsd.template_release.x86_64 \
            stage/linux_release.x86_64

          printf '%s\n' "$VERSION_ID" > stage/version.txt

          (
            cd stage
            zip -9 -r "../dist/godot-${GODOT_TAG}-linux-x86_64.zip" .
          )

      - name: 上传 Linux 包到草稿 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          assets=(dist/*.zip)

          if [[ "${#assets[@]}" -ne 1 ]]; then
            printf '期望1个Linux ZIP文件，实际找到%s个\n' \
              "${#assets[@]}" >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  windows:
    needs:
      - detect
      - prepare
    if: needs.detect.outputs.should_build == 'true'
    runs-on: windows-2025
    timeout-minutes: 240

    permissions:
      contents: write

    env:
      GODOT_TAG: ${{ needs.detect.outputs.tag }}
      VERSION_ID: ${{ needs.detect.outputs.version_id }}
      RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}

    steps:
      - name: 获取 Godot 源码
        uses: actions/checkout@v7
        with:
          repository: godotengine/godot
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 SCons
        shell: pwsh
        run: |
          python -m pip install 'scons>=4.4,<5'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 安装 Windows 构建 SDK
        shell: pwsh
        run: |
          python misc/scripts/install_d3d12_sdk_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python misc/scripts/install_accesskit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python misc/scripts/install_angle.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 编译 Windows x86_64 模板
        shell: pwsh
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_PCK_KEY }}
        run: |
          if ($env:SCRIPT_AES256_ENCRYPTION_KEY -notmatch '^[0-9A-Fa-f]{64}$') {
            throw 'GODOT_PCK_KEY 必须是64个十六进制字符。'
          }

          scons --jobs=4 `
            platform=windows `
            target=template_debug `
            arch=x86_64 `
            module_camera_enabled=no `
            debug_symbols=no

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          scons --jobs=4 `
            platform=windows `
            target=template_release `
            arch=x86_64 `
            module_camera_enabled=no `
            debug_symbols=no

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & .\bin\godot.windows.template_release.x86_64.console.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 打包 Windows 模板
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage, dist | Out-Null

          $files = @{
            'godot.windows.template_debug.x86_64.exe' =
              'windows_debug_x86_64.exe'

            'godot.windows.template_debug.x86_64.console.exe' =
              'windows_debug_x86_64_console.exe'

            'godot.windows.template_release.x86_64.exe' =
              'windows_release_x86_64.exe'

            'godot.windows.template_release.x86_64.console.exe' =
              'windows_release_x86_64_console.exe'
          }

          foreach ($item in $files.GetEnumerator()) {
            Copy-Item `
              (Join-Path bin $item.Key) `
              (Join-Path stage $item.Value)
          }

          Set-Content `
            -NoNewline `
            -Path stage/version.txt `
            -Value $env:VERSION_ID

          Compress-Archive `
            -CompressionLevel Optimal `
            -Path stage/* `
            -DestinationPath "dist/godot-$env:GODOT_TAG-windows-x86_64.zip"

      - name: 上传 Windows 包到草稿 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -Filter '*.zip' -File)
          if ($assets.Count -ne 1) {
            throw "期望1个Windows ZIP文件，实际找到$($assets.Count)个。"
          }

          gh release upload `
            $env:RELEASE_TAG `
            $assets[0].FullName `
            --repo $env:GITHUB_REPOSITORY `
            --clobber

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos:
    needs:
      - detect
      - prepare
    if: needs.detect.outputs.should_build == 'true'
    runs-on: macos-26
    timeout-minutes: 300

    permissions:
      contents: write

    env:
      GODOT_TAG: ${{ needs.detect.outputs.tag }}
      RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}

    steps:
      - name: 获取 Godot 源码
        uses: actions/checkout@v7
        with:
          repository: godotengine/godot
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装 SCons
        shell: bash
        run: |
          python -m pip install 'scons>=4.4,<5'

      - name: 安装 macOS 构建 SDK
        shell: bash
        run: |
          sh misc/scripts/install_vulkan_sdk_macos.sh
          python misc/scripts/install_accesskit.py
          python misc/scripts/install_angle.py

      - name: 编译 Universal 2 macOS 模板
        shell: bash
        env:
          SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.GODOT_PCK_KEY }}
        run: |
          if [[ ! "${SCRIPT_AES256_ENCRYPTION_KEY:-}" =~ ^[0-9A-Fa-f]{64}$ ]]; then
            echo "GODOT_PCK_KEY 必须是64个十六进制字符。" >&2
            exit 1
          fi

          scons --jobs=3 \
            platform=macos \
            target=template_debug \
            arch=arm64 \
            module_camera_enabled=no \
            debug_symbols=no

          scons --jobs=3 \
            platform=macos \
            target=template_release \
            arch=arm64 \
            module_camera_enabled=no \
            debug_symbols=no

          scons --jobs=3 \
            platform=macos \
            target=template_debug \
            arch=x86_64 \
            module_camera_enabled=no \
            debug_symbols=no

          scons --jobs=3 \
            platform=macos \
            target=template_release \
            arch=x86_64 \
            module_camera_enabled=no \
            debug_symbols=no \
            generate_bundle=yes

          test -f bin/godot_macos.zip
          unzip -t bin/godot_macos.zip

      - name: 打包 macOS 模板
        shell: bash
        run: |
          mkdir -p dist
          cp bin/godot_macos.zip \
            "dist/godot-${GODOT_TAG}-macos-universal.zip"

      - name: 上传 macOS 包到草稿 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          assets=(dist/*.zip)

          if [[ "${#assets[@]}" -ne 1 ]]; then
            printf '期望1个macOS ZIP文件，实际找到%s个\n' \
              "${#assets[@]}" >&2
            exit 1
          fi

          gh release upload "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish:
    needs:
      - detect
      - prepare
      - linux
      - windows
      - macos

    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ github.token }}
      GODOT_TAG: ${{ needs.detect.outputs.tag }}
      RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}

    steps:
      - name: 从草稿 Release 下载三个平台包
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.zip' \
            --dir release-assets

      - name: 检查资产并生成 SHA-256
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t assets < <(
            find release-assets \
              -maxdepth 1 \
              -type f \
              -name '*.zip' |
            sort
          )

          if [[ "${#assets[@]}" -ne 3 ]]; then
            printf '期望3个ZIP文件，实际找到%s个\n' \
              "${#assets[@]}" >&2
            exit 1
          fi

          (
            cd release-assets
            sha256sum *.zip > SHA256SUMS
          )

      - name: 上传校验文件并发布 Release
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" release-assets/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
